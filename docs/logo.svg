<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 290" width="252" height="290">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#251D35"/>
      <stop offset="100%" stop-color="#130F1D"/>
    </radialGradient>
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1326E"/>
      <stop offset="55%" stop-color="#CA225E"/>
      <stop offset="100%" stop-color="#961342"/>
    </linearGradient>
    <linearGradient id="blue-wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#1D4E89" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber-wave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Outer Precision Hex Border -->
  <polygon points="126,6 244,74 244,216 126,284 8,216 8,74"
           fill="url(#rim-grad)" stroke="#88113B" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="126,16 235,79 235,211 126,274 17,211 17,79"
           fill="url(#bg-grad)" stroke="#F48FB1" stroke-opacity="0.45" stroke-width="1.25" stroke-linejoin="round"/>

  <!-- Subtle Horizon Baseline -->
  <line x1="42" y1="112" x2="210" y2="112" stroke="#94A3B8" stroke-opacity="0.32" stroke-width="1"/>

  <!-- Mirrored Overlap Lenses ("Comparable Counterfactuals") -->
  <path d="M 46 112 C 68 112, 86 68, 114 68 C 142 68, 162 112, 198 112 Z"
        fill="url(#blue-wave)" stroke="#93C5FD" stroke-opacity="0.72" stroke-width="1.5"/>
  <path d="M 54 112 C 88 112, 108 150, 138 150 C 166 150, 184 112, 206 112 Z"
        fill="url(#amber-wave)" stroke="#FCD34D" stroke-opacity="0.68" stroke-width="1.5"/>

  <!-- Initial ML Path vs. Targeted Calibration Ring ("Predict, Then Target") -->
  <path d="M 56 128 Q 112 138 154 106"
        fill="none" stroke="#94A3B8" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 56 120 Q 108 124 146 88"
        fill="none" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>

  <!-- Focal Target Calibration Rings -->
  <circle cx="152" cy="84" r="18" fill="none" stroke="#CA225E" stroke-opacity="0.38" stroke-width="1.6"/>
  <circle cx="152" cy="84" r="11" fill="#CA225E" fill-opacity="0.22" stroke="#F472B6" stroke-width="2"/>
  <circle cx="152" cy="84" r="4.5" fill="#FFFFFF"/>

  <!-- Divider Accent -->
  <line x1="98" y1="164" x2="154" y2="164" stroke="#CA225E" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Editorial Typography -->
  <text x="126" y="200" text-anchor="middle" fill="#FFFFFF"
        font-family="-apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="35" font-weight="700" letter-spacing="-0.6">tidytmle</text>
  <text x="126" y="224" text-anchor="middle" fill="#F4A5C0"
        font-family="-apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="2.2">TARGETED CAUSAL ML</text>
</svg>
