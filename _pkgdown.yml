url: https://perceptioninterval.github.io/tidytmle/

template:
  package: tidytemplate
  bootstrap: 5
  bslib:
    danger: "#CA225E"
    primary: "#CA225E"

home:
  title: Targeted Maximum Likelihood Estimation for Tidymodels • tidytmle
  description: >
    Human-centered, cross-fitted Targeted Maximum Likelihood Estimation (CV-TMLE)
    built natively on workflows, workflowsets, recipes, rsample, hardhat, and yardstick.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

development:
  mode: unreleased

figures:
  fig.width: 8
  fig.height: 5.75

reference:
  - title: 1. Ask Your Causal Question & Compose Learners
    desc: >
      Declare outcomes, treatments, confounders, missingness indicators,
      clusters, and weights using tidyselect, and attach any recipes, parsnip
      specs, workflows, or workflow_set ensembles.
    contents:
      - tmle_spec
      - set_preprocessing
      - set_outcome_learners
      - set_treatment_learners
      - set_censoring_learners
      - set_resamples
      - set_targeting
      - default_nuisance_learners

  - title: 2. Estimate & Stress-Test Instantly
    desc: >
      Execute the cross-fitted "Predict, Then Target" estimator (fit), explore
      stricter bounds or subgroups without refitting ML models (retarget), or
      evaluate continuous dose policies (shift, scale_tx).
    contents:
      - fit.tmle_spec
      - retarget
      - shift
      - scale_tx

  - title: 3. Understand, Audit & Report Results
    desc: >
      Run a 5-pillar causal trust audit (check_tmle), generate copy-paste-ready
      Methods and Results prose (report_tmle), inspect visual diagnostics
      (autoplot), and extract tidy tables with simultaneous CIs and E-values.
    contents:
      - check_tmle
      - report_tmle
      - autoplot.tmle_fit
      - explain_tmle
      - tidy.tmle_fit
      - glance.tmle_fit
      - augment.tmle_fit
      - collect_metrics.tmle_fit
      - extract_sl_weights

  - title: 4. Individualized Effects (CATE) & Synthetic Benchmarks
    desc: >
      Estimate who benefits most via Doubly Robust CATE regression, evaluate
      treatment prioritization with Qini uplift curves, and benchmark workflows
      against known ground truth.
    contents:
      - fit_cate
      - predict.tmle_cate
      - autoplot.tmle_cate
      - qini_auc
      - sim_causal_cohort

  - title: Re-exported Generics & Package Overview
    contents:
      - reexports
      - tidytmle-package

articles:
  - title: Get started
    navbar: ~
    contents:
      - tidytmle
  - title: Articles
    navbar: Articles
    contents:
      - tmle-intuition
      - workflows-and-super-learning
      - lmtp-and-cate
      - benchmarks-and-validation
