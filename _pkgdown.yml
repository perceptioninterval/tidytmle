url: https://perceptioninterval.github.io/tidytmle/

template:
  package: tidytemplate
  bootstrap: 5
  bslib:
    danger: "#CA225E"
    primary: "#CA225E"

home:
  title: Targeted Maximum Likelihood Estimation for Tidymodels • tidytmle
  description: >
    Cross-fitted Targeted Maximum Likelihood Estimation (CV-TMLE) built natively
    on top of workflows, workflowsets, recipes, rsample, hardhat, and yardstick.

development:
  mode: auto

figures:
  fig.width: 8
  fig.height: 5.75

reference:
  - title: Step 0 · Specification & Causal Roles
    desc: >
      Declare outcome, treatment, confounders, censoring, clusters, and case
      weights via tidyselect, and compose recipes, parsnip specs, workflows,
      or workflow_set Super Learners with built-in CV-TMLE and positivity
      guardrails.
    contents:
      - tmle_spec
      - set_preprocessing
      - set_outcome_learners
      - set_treatment_learners
      - set_censoring_learners
      - set_resamples
      - set_targeting
      - default_nuisance_learners

  - title: Steps 1–5 · Estimation & Instant Retargeting
    desc: >
      Run the "Predict, Then Target" CV-TMLE pipeline (fit) and re-run
      fluctuation, positivity bounds, estimands, or subgroups in milliseconds
      without refitting ML nuisance models (retarget), or target continuous
      exposures with Modified Treatment Policies (shift, scale_tx).
    contents:
      - fit.tmle_spec
      - retarget
      - shift
      - scale_tx

  - title: Inference, Diagnostics & Tidymodels Verbs
    desc: >
      Decode every stage of the TMLE estimator via standard tidymodels S3
      verbs, plain-English explanations (explain_tmle / summary), and visual
      diagnostics powered by the joint Efficient Influence Function (EIF).
    contents:
      - tidy.tmle_fit
      - explain_tmle
      - glance.tmle_fit
      - augment.tmle_fit
      - collect_metrics.tmle_fit
      - extract_sl_weights
      - autoplot.tmle_fit

  - title: Heterogeneous Treatment Effects (CATE) & Simulation
    desc: >
      Doubly Robust CATE learning, uplift evaluation, and synthetic causal
      benchmarking cohorts.
    contents:
      - fit_cate
      - predict.tmle_cate
      - qini_auc
      - sim_causal_cohort

  - title: Re-exported Generics & Package Overview
    contents:
      - reexports
      - tidytmle-package

articles:
  - title: Get started
    navbar: ~
    contents:
      - tidytmle
  - title: Articles
    navbar: Articles
    contents:
      - tmle-intuition
      - workflows-and-super-learning
      - lmtp-and-cate
